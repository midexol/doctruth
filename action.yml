name: stale
description: Flag docs, comments and examples that a pull request made untrue.
branding:
  icon: book-open
  color: yellow
inputs:
  base:
    description: Base ref to diff against
    default: ${{ github.event.pull_request.base.sha }}
  args:
    description: Extra arguments for `stale check` (e.g. --run-snippets --llm)
    default: ""
  fail:
    description: Fail the job when stale docs are found
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - shell: bash
      run: |
        stale check --base "${{ inputs.base }}" --head HEAD --format github ${{ inputs.args }} \
          $([ "${{ inputs.fail }}" = "true" ] || echo --no-fail)

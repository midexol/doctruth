[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stale-docs"
version = "0.1.0"
description = "A linter for documentation that your code change just made untrue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stale = "stale.cli:main"

[tool.setuptools]
packages = ["stale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
